<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>KOJO Guide</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Внутренний справочник для сотрудников KOJO Coffee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="KOJO Guide" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css?v=11" />
</head>
<body>
  <div class="login-screen" id="login-screen">
    <div class="login-card" id="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 80 37" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5.60452 3.82117V12.928L13.2337 3.82933H19.9444V4.15181L10.707 14.4914L21.2302 26.0719V26.4841H14.4746L5.60452 16.2385V26.4841H0V3.82117H5.60452Z" fill="currentColor"/>
          <path d="M44.3057 15.181C44.3057 21.704 39.8482 26.9901 32.4966 26.9901C25.145 26.9901 20.7324 21.704 20.7324 15.181C20.7324 8.65807 25.2348 3.37195 32.4476 3.37195C39.6604 3.37195 44.3016 8.70297 44.3016 15.181H44.3057ZM26.3369 15.181C26.3369 18.6262 28.4024 21.8428 32.4925 21.8428C36.5826 21.8428 38.6481 18.6262 38.6481 15.181C38.6481 11.7359 36.2602 8.4703 32.4925 8.4703C28.4473 8.4703 26.3369 11.7808 26.3369 15.181Z" fill="currentColor"/>
          <path d="M53.1923 0V27.5695C53.1923 33.174 50.7553 36.8069 45.657 36.8069C44.0038 36.8069 42.2567 36.3498 40.6484 35.2925L42.669 30.9289C43.6323 31.3902 44.5549 31.6188 45.3794 31.5739C47.2163 31.4841 47.6327 30.0554 47.6327 27.5776V0H53.1923Z" fill="currentColor"/>
          <path d="M79.999 15.181C79.999 21.704 75.5415 26.9901 68.19 26.9901C60.8384 26.9901 56.4258 21.704 56.4258 15.181C56.4258 8.65807 60.9282 3.37195 68.141 3.37195C75.3538 3.37195 79.995 8.70297 79.995 15.181H79.999ZM62.0303 15.181C62.0303 18.6262 64.0998 21.8428 68.1859 21.8428C72.2719 21.8428 74.3415 18.6262 74.3415 15.181C74.3415 11.7359 71.9535 8.4703 68.1859 8.4703C64.1407 8.4703 62.0303 11.7808 62.0303 15.181Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="login-title">KOJO COFFEE</div>
      <div class="login-sub">Guide for staff</div>
      <form class="login-form" id="login-form">
        <div id="account-picker"></div>
        <input type="text" id="login-user" class="login-input hidden-input" placeholder="Логин" autocomplete="off" hidden />
        <input type="password" id="login-pass" class="login-input" placeholder="Пароль" autocomplete="current-password" />
        <div class="login-error" id="login-error"></div>
        <label class="login-remember">
          <input type="checkbox" id="login-remember" checked />
          <span>Запомнить меня</span>
        </label>
        <button type="submit" class="login-btn">Войти</button>
      </form>
      <div class="login-hint">Внутренний справочник для сотрудников KOJO Coffee</div>
    </div>
  </div>

  <div class="app">
    <header class="header">
      <div class="logo-wrap">
        <div class="logo">
          <svg viewBox="0 0 80 37" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5.60452 3.82117V12.928L13.2337 3.82933H19.9444V4.15181L10.707 14.4914L21.2302 26.0719V26.4841H14.4746L5.60452 16.2385V26.4841H0V3.82117H5.60452Z" fill="currentColor"/>
            <path d="M44.3057 15.181C44.3057 21.704 39.8482 26.9901 32.4966 26.9901C25.145 26.9901 20.7324 21.704 20.7324 15.181C20.7324 8.65807 25.2348 3.37195 32.4476 3.37195C39.6604 3.37195 44.3016 8.70297 44.3016 15.181H44.3057ZM26.3369 15.181C26.3369 18.6262 28.4024 21.8428 32.4925 21.8428C36.5826 21.8428 38.6481 18.6262 38.6481 15.181C38.6481 11.7359 36.2602 8.4703 32.4925 8.4703C28.4473 8.4703 26.3369 11.7808 26.3369 15.181Z" fill="currentColor"/>
            <path d="M53.1923 0V27.5695C53.1923 33.174 50.7553 36.8069 45.657 36.8069C44.0038 36.8069 42.2567 36.3498 40.6484 35.2925L42.669 30.9289C43.6323 31.3902 44.5549 31.6188 45.3794 31.5739C47.2163 31.4841 47.6327 30.0554 47.6327 27.5776V0H53.1923Z" fill="currentColor"/>
            <path d="M79.999 15.181C79.999 21.704 75.5415 26.9901 68.19 26.9901C60.8384 26.9901 56.4258 21.704 56.4258 15.181C56.4258 8.65807 60.9282 3.37195 68.141 3.37195C75.3538 3.37195 79.995 8.70297 79.995 15.181H79.999ZM62.0303 15.181C62.0303 18.6262 64.0998 21.8428 68.1859 21.8428C72.2719 21.8428 74.3415 18.6262 74.3415 15.181C74.3415 11.7359 71.9535 8.4703 68.1859 8.4703C64.1407 8.4703 62.0303 11.7808 62.0303 15.181Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-title">KOJO COFFEE</div>
          <div class="logo-sub">Guide for staff</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="header-sync-badge" id="sync-badge" title="Статус синхронизации">☁️</span>
        <button class="avatar-btn" id="header-avatar" data-action="show-profile" aria-label="Профиль" title="Профиль"></button>
      </div>
    </header>

    <main id="home-screen"></main>
    <main id="section-screen" class="screen"></main>
    <main id="topic-screen" class="screen"></main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <div class="modal-overlay" id="stats-modal">
    <div class="modal-content">
      <h3>📊 Статистика чек-листов</h3>
      <div id="stats-content"></div>
      <div class="modal-actions">
        <button data-action="export-progress">⬇️ Экспорт</button>
        <button data-action="import-progress">⬆️ Импорт</button>
        <button data-action="close-modal">Закрыть</button>
        <button class="primary" data-action="reset-all">Сбросить всё</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="sync-modal">
    <div class="modal-content">
      <h3>⚙️ Синхронизация (облако)</h3>
      <div id="sync-modal-content"></div>
      <div class="modal-actions">
        <button data-action="close-sync-modal">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal-content profile-modal">
      <div class="profile-head">
        <div class="profile-avatar" id="profile-avatar"></div>
        <div class="profile-user">
          <div class="profile-name" id="profile-name"></div>
          <div class="profile-role" id="profile-role"></div>
          <div class="profile-meta" id="profile-meta"></div>
        </div>
      </div>
      <label class="profile-photo-btn" for="photo-file">📷 Изменить фото</label>
      <input type="file" id="photo-file" accept="image/*" class="hidden" />
      <div class="profile-label">📝 Мои заметки</div>
      <textarea id="profile-notes" class="profile-notes" placeholder="Личные заметки… (синхронизируются через облако)"></textarea>
      <div class="profile-saved" id="notes-saved"></div>

      <div class="profile-section-title">
        <span>📖 Книга рецептов</span>
        <button class="recipe-add-btn" data-action="add-recipe">➕ Добавить</button>
      </div>
      <div class="recipe-list" id="recipes-list"></div>

      <div class="profile-section-label">Меню</div>
      <div class="profile-menu">
        <button class="profile-item" data-action="toggle-theme">🌙 Тема (светлая / тёмная / красная)</button>
        <button class="profile-item" data-action="show-stats">📊 Статистика и экспорт</button>
        <button class="profile-item" id="btn-control" data-action="show-control" style="display:none">📋 Контроль</button>
        <button class="profile-item" data-action="open-sync-settings">⚙️ Синхронизация</button>
        <button class="profile-item danger" data-action="logout">🔒 Выйти</button>
      </div>
      <div class="modal-actions">
        <button data-action="close-profile">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="recipe-modal">
    <div class="modal-content recipe-modal-content">
      <h3 id="recipe-modal-title">📖 Рецепт</h3>
      <div style="display:grid;gap:10px">
        <div class="recipe-field-row">
          <label>Название</label>
          <input type="text" id="recipe-name" class="login-input" placeholder="Например: утренний V60" />
        </div>
        <div class="recipe-field-row">
          <label>Метод</label>
          <select id="recipe-method" class="login-input">
            <option value="aeropress">Аэропресс</option>
            <option value="v60">Воронка (V60)</option>
          </select>
        </div>
        <div class="recipe-calc">
          <div class="recipe-field-row">
            <label>Кофе, г</label>
            <input type="number" id="recipe-dose" class="login-input" min="0" step="0.5" placeholder="16" />
          </div>
          <div class="recipe-field-row">
            <label>Вода, мл</label>
            <input type="number" id="recipe-water" class="login-input" min="0" step="5" placeholder="240" />
          </div>
          <div class="recipe-field-row">
            <label>Блю ратио</label>
            <input type="number" id="recipe-ratio" class="login-input" min="1" step="0.5" placeholder="15" />
            <div class="recipe-ratio-hint">1:<span id="recipe-ratio-display">15</span></div>
          </div>
        </div>
        <div class="recipe-calc">
          <div class="recipe-field-row">
            <label>Температура, °C</label>
            <input type="number" id="recipe-temp" class="login-input" min="0" max="100" step="1" placeholder="92" />
          </div>
          <div class="recipe-field-row">
            <label>Время (мм:сс)</label>
            <input type="text" id="recipe-time" class="login-input" placeholder="2:30" />
          </div>
          <div class="recipe-field-row">
            <label>Помол</label>
            <input type="text" id="recipe-grind" class="login-input" placeholder="напр. средний" />
          </div>
        </div>
        <div class="recipe-field-row">
          <label>Шаги / заметки</label>
          <textarea id="recipe-steps" class="profile-notes" rows="4" placeholder="1. Залить 60 г воды…"></textarea>
        </div>
        <label class="recipe-fav-row"><input type="checkbox" id="recipe-fav" /> ★ В избранное</label>
      </div>
      <div class="modal-actions">
        <button data-action="delete-recipe" id="recipe-delete-btn" class="danger">🗑 Удалить</button>
        <button data-action="close-recipe">Отмена</button>
        <button class="primary" data-action="save-recipe">💾 Сохранить</button>
      </div>
    </div>
  </div>

  <div class="install-banner" id="install-banner">
    <span>📲 Установи KOJO Guide на телефон</span>
    <button class="install-primary" data-action="install-app">Установить</button>
    <button class="install-close" data-action="dismiss-install" aria-label="Скрыть">✕</button>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" class="hidden" />

  <script src="js/data.js?v=11"></script>
  <script src="js/accounts.js?v=11"></script>
  <script src="js/state.js?v=11"></script>
  <script src="js/sync.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
