  <style>
:root {
  --bg: #ffffff;
  --bg-soft: #f5f5f5;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #111827;
  --muted: #6b7280;
  --accent: #111827;
  --accent-soft: #f4f4f5;
  --success: #22c55e;
  --success-bg: #f0fdf4;
  --success-border: #86efac;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --warning: #f59e0b;
  --warning-bg: #fffbeb;
  --info: #3b82f6;
  --info-bg: #eff6ff;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 4px 16px rgba(15, 23, 42, 0.1);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background var(--transition), color var(--transition);
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px calc(100px + env(safe-area-inset-bottom));
  position: relative;
}

.app.locked {
  display: none;
}

.login-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
}

.login-screen.visible {
  display: flex;
}

.login-card {
  width: 100%;
  max-width: 380px;
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 36px 28px 28px;
  text-align: center;
}

.login-logo svg {
  width: 76px;
  height: 36px;
  color: var(--accent);
}

.login-title {
  margin-top: 14px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.06em;
}

.login-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

.login-form {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.login-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.login-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
}

.login-error {
  min-height: 18px;
  font-size: 13px;
  color: var(--danger);
}

.login-remember {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

.login-remember input {
  accent-color: var(--accent);
}

.login-btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 12px;
  background: var(--accent);
  color: var(--bg);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity var(--transition);
}

.login-btn:hover {
  opacity: 0.88;
}

body.dark .login-btn {
  color: #18181b;
}

body.red .login-btn {
  color: #1a0a0a;
}

.login-hint {
  margin-top: 20px;
  font-size: 12px;
  color: var(--muted);
}

.login-card.shake {
  animation: shake 0.5s;
}

@keyframes shake {
  10%, 90% { transform: translateX(-1px); }
  20%, 80% { transform: translateX(2px); }
  30%, 50%, 70% { transform: translateX(-3px); }
  40%, 60% { transform: translateX(3px); }
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 0 8px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.85);
  transition: background var(--transition);
}

body.dark .header {
  background: rgba(24, 24, 27, 0.85);
}

body.red .header {
  background: rgba(26, 10, 10, 0.85);
}

.logo-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  height: 32px;
  display: inline-flex;
  align-items: center;
}

.logo svg {
  height: 32px;
  width: auto;
  display: block;
  color: var(--text);
}

.logo-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.logo-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.logo-sub {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-tag {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
  border: 1px solid var(--border);
}

.header-sync-badge {
  font-size: 15px;
  line-height: 1;
  padding: 2px;
}

/* Кнопка-аватар профиля в шапке */
.avatar-btn {
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 2px solid var(--border);
  background: var(--bg-soft);
  background-size: cover;
  background-position: center;
  color: var(--text);
  font-size: 17px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  overflow: hidden;
  flex-shrink: 0;
}

.avatar-btn:hover {
  border-color: var(--text);
  transform: scale(1.06);
}

body.dark .avatar-btn,
body.red .avatar-btn {
  background: var(--accent-soft);
}

/* Профиль */
.profile-modal {
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
}

.profile-head {
  display: flex;
  align-items: center;
  gap: 14px;
}

.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 999px;
  flex-shrink: 0;
  background: var(--accent-soft);
  background-size: cover;
  background-position: center;
  border: 2px solid var(--border);
  color: var(--text);
  font-size: 30px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.profile-user {
  min-width: 0;
}

.profile-name {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: break-word;
}

.profile-role {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.profile-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

.profile-photo-btn {
  display: block;
  margin-top: 12px;
  padding: 10px;
  text-align: center;
  border-radius: 999px;
  border: 1px dashed var(--border-strong);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  background: var(--bg);
  user-select: none;
}

.profile-photo-btn:hover {
  border-color: var(--text);
  color: var(--text);
  border-style: solid;
}

.profile-label {
  margin-top: 16px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.profile-notes {
  width: 100%;
  min-height: 90px;
  margin-top: 6px;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  resize: vertical;
  outline: none;
  transition: border-color var(--transition);
  box-sizing: border-box;
}

.profile-notes:focus {
  border-color: var(--text);
}

.profile-saved {
  min-height: 16px;
  font-size: 11px;
  color: var(--success);
  margin-top: 4px;
  text-align: right;
  opacity: 0;
  transition: opacity var(--transition);
}

.profile-saved.visible {
  opacity: 1;
}

.profile-section-label {
  margin: 16px 0 6px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.profile-menu {
  display: grid;
  gap: 8px;
}

.profile-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  text-align: left;
}

.profile-item:hover {
  border-color: var(--text);
}

.profile-item.danger {
  color: var(--danger);
}

.profile-item.danger:hover {
  border-color: var(--danger);
  background: var(--danger-bg);
}

/* Адаптивность для маленьких экранов */
@media (max-width: 420px) {
  .app {
    padding: 12px 12px calc(80px + env(safe-area-inset-bottom));
  }

  .login-card {
    padding: 28px 20px 22px;
  }

  .grid {
    gap: 8px;
  }

  .tile {
    padding: 12px 10px;
  }

  .tile .tile-icon {
    font-size: 18px;
  }

  .modal-content {
    padding: 18px;
  }

  .hero-title {
    font-size: 21px;
  }

  .checklist-stats,
  .quick-checklist-access {
    gap: 6px;
  }

  .stat-card {
    padding: 8px 6px;
  }

  .stat-card .stat-value {
    font-size: 16px;
  }
}

.icon-btn {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 999px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  transition: all var(--transition);
  position: relative;
  touch-action: manipulation;
}

.icon-btn:hover {
  border-color: var(--text);
  transform: scale(1.05);
}

.icon-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--danger);
  color: white;
  font-size: 9px;
  font-weight: 700;
  width: 18px;
  height: 18px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;
}

body.dark {
  --bg: #18181b;
  --bg-soft: #27272a;
  --border: #3f3f46;
  --border-strong: #52525b;
  --text: #ffffff;
  --muted: #a1a1aa;
  --accent: #ffffff;
  --accent-soft: #27272a;
  --success-bg: #052e16;
  --success-border: #166534;
  --danger-bg: #450a0a;
  --warning-bg: #451a03;
  --info-bg: #172554;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
}

body.red {
  --bg: #1a0a0a;
  --bg-soft: #2d1313;
  --border: #4a2020;
  --border-strong: #6b2d2d;
  --text: #ffffff;
  --muted: #d4a0a0;
  --accent: #e74c3c;
  --accent-soft: #2d1313;
  --success: #22c55e;
  --success-bg: #052e16;
  --success-border: #166534;
  --danger: #ef4444;
  --danger-bg: #450a0a;
  --warning: #f59e0b;
  --warning-bg: #451a03;
  --info: #e74c3c;
  --info-bg: #2d1313;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

body.dark .tile,
body.dark .screen-box,
body.dark .checklist-item,
body.dark details.item,
body.dark .item-link,
body.dark .hero,
body.dark .modal-content {
  background: #18181b;
}

body.dark .back-icon,
body.dark .icon-btn {
  background: #27272a;
}

body.dark .search input {
  background: #27272a;
  color: #ffffff;
  border-color: #3f3f46;
}

body.dark .search input::placeholder {
  color: #71717a;
}

body.dark .checklist-item.completed {
  background: #052e16;
  border-color: #166534;
}

body.dark .checklist-item.completed .checklist-text {
  color: #86efac;
}

body.dark .quick-action {
  background: #27272a;
}

body.dark .quick-action:hover {
  background: #3f3f46;
}

body.red .tile,
body.red .screen-box,
body.red .checklist-item,
body.red details.item,
body.red .item-link,
body.red .hero,
body.red .modal-content {
  background: #1a0a0a;
}

body.red .back-icon,
body.red .icon-btn {
  background: #2d1313;
}

body.red .search input {
  background: #2d1313;
  color: #ffffff;
  border-color: #4a2020;
}

body.red .search input::placeholder {
  color: #a06060;
}

body.red .checklist-item.completed {
  background: #052e16;
  border-color: #166534;
}

body.red .checklist-item.completed .checklist-text {
  color: #86efac;
}

body.red .quick-action {
  background: #2d1313;
}

body.red .quick-action:hover {
  background: #4a2020;
}

#home-screen { margin-top: 16px; }

.hero {
  padding: 18px 16px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: #ffffff;
  transition: background var(--transition), border-color var(--transition);
}

.hero-title {
  margin: 0 0 6px;
  font-size: 24px;
  font-weight: 700;
}

.hero-sub {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.6;
}

.quick-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.quick-action {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all var(--transition);
  text-decoration: none;
  touch-action: manipulation;
  min-height: 44px;
}

.quick-action:hover {
  border-color: var(--text);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.quick-action .emoji {
  font-size: 14px;
}

.quick-action.primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.quick-action.primary:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}

.search {
  margin-top: 14px;
  position: relative;
}

.search input {
  width: 100%;
  border-radius: 999px;
  padding: 11px 40px 11px 40px;
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: all var(--transition);
}

.search input:focus {
  border-color: var(--text);
  box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.06);
}

.search .search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 16px;
  pointer-events: none;
}

.search .clear-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 8px;
  display: none;
}

.search .clear-btn.visible {
  display: block;
}

.search .clear-btn:hover {
  color: var(--text);
}

.search-results-count {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
  padding-left: 4px;
}

.search-suggestions {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  margin-top: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  z-index: 200;
  max-height: 300px;
  overflow-y: auto;
  display: none;
}

.search-suggestions.visible {
  display: block;
}

.search-suggestions .suggestion-item {
  padding: 10px 14px;
  cursor: pointer;
  touch-action: manipulation;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-suggestions .suggestion-item > * { pointer-events: auto; }

.search-suggestions .suggestion-item:last-child {
  border-bottom: none;
}

.search-suggestions .suggestion-item:hover,
.search-suggestions .suggestion-item.highlighted {
  background: var(--accent-soft);
}

.search-suggestions .suggestion-item .sug-icon {
  font-size: 14px;
}

.search-suggestions .suggestion-item .sug-section {
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.chips {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  user-select: none;
}

.chip:hover {
  border-color: var(--text);
  color: var(--text);
  transform: translateY(-1px);
}

.chip.active {
  border-color: var(--text);
  background: var(--text);
  color: var(--bg);
}

.section { margin-top: 24px; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.section-header h2 {
  font-size: 16px;
  margin: 0;
  font-weight: 600;
}

.section-header .see-all {
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 999px;
  transition: all var(--transition);
}

.section-header .see-all:hover {
  background: var(--bg-soft);
  color: var(--text);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.tile {
  border-radius: var(--radius);
  padding: 14px 12px;
  background: #ffffff;
  border: 1px solid var(--border);
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.tile > * { pointer-events: auto; }

.tile:hover {
  border-color: var(--text);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.tile:active {
  transform: scale(0.97);
}

.tile .tile-icon {
  font-size: 20px;
  margin-bottom: 6px;
  display: block;
}

.tile-title {
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 4px;
}

.tile-text {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.tile .tile-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  background: var(--bg-soft);
  padding: 2px 8px;
  border-radius: 999px;
  color: var(--muted);
}

.screen {
  display: none;
  margin-top: 16px;
  animation: fadeSlideIn 0.3s ease;
}

.screen.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  touch-action: manipulation;
  padding: 4px 0;
  margin-bottom: 8px;
  transition: color var(--transition);
}
.back > * { pointer-events: auto; }

.back:hover {
  color: var(--text);
}

.back-icon {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  background: #ffffff;
  transition: all var(--transition);
}

.back:hover .back-icon {
  border-color: var(--text);
  background: var(--accent-soft);
}

.screen-box {
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: #ffffff;
  padding: 16px 16px 14px;
  transition: background var(--transition), border-color var(--transition);
}

.screen-title {
  margin: 0 0 4px;
  font-size: 20px;
  font-weight: 700;
}

.screen-sub {
  margin: 0 0 14px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

.list {
  display: grid;
  gap: 8px;
}

/* Единый стиль для всех элементов навигации как в "Что делать если" */
.item-link {
  width: 100%;
  text-align: left;
  border-radius: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  background: #ffffff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  touch-action: manipulation;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}
.item-link > * { pointer-events: auto; }

.item-link:hover {
  background: var(--bg-soft);
  border-color: var(--text);
  transform: translateX(4px);
}

.item-link .link-icon {
  font-size: 16px;
}

.item-link .link-arrow {
  margin-left: auto;
  color: var(--muted);
}

/* Стиль для вложенных элементов в разделах (details) */
details.item {
  border-radius: 12px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  background: #ffffff;
  transition: all var(--transition);
}

details.item[open] {
  border-color: var(--text);
  background: var(--accent-soft);
}

details summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  list-style: none;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

details summary::-webkit-details-marker { display: none; }

details summary .expand-icon {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  transition: transform var(--transition);
}

details[open] summary .expand-icon {
  transform: rotate(180deg);
}

.item-body {
  padding-top: 6px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
}

.checklist {
  list-style: none;
  padding: 0;
  margin: 0;
}

.checklist-item {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  margin-bottom: 8px;
  background: #ffffff;
  transition: all var(--transition);
  cursor: default;
}

.checklist-item:hover {
  border-color: var(--border-strong);
}

.checklist-item.checklist-section-label {
  background: transparent;
  border: none;
  padding: 16px 4px 6px;
  margin-bottom: 2px;
  cursor: default;
  pointer-events: none;
}

.checklist-item.checklist-section-label span {
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
  color: var(--text);
}

.checklist-item.completed {
  background: var(--success-bg);
  border-color: var(--success-border);
  opacity: 0.85;
}

.checklist-item.completed .checklist-text {
  text-decoration: line-through;
  color: var(--muted);
}

.checklist-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  width: 100%;
}

.checklist-checkbox {
  margin-top: 2px;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: var(--success);
  transition: transform var(--transition);
  appearance: none;
  -webkit-appearance: none;
  border: 2px solid var(--border-strong);
  border-radius: 4px;
  background: white;
  position: relative;
}

.checklist-checkbox:checked {
  background: var(--success);
  border-color: var(--success);
}

.checklist-checkbox:checked::after {
  content: '✓';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 12px;
  font-weight: 700;
}

.checklist-checkbox:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 2px;
}

.checklist-text {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}

.checklist-item .step-text {
  margin-left: 28px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.checklist-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.checklist-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}

.progress-bar {
  width: 80px;
  height: 4px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--success);
  border-radius: 999px;
  transition: width 0.5s ease;
  width: 0%;
}

.reset-btn {
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--bg-soft);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  transition: all var(--transition);
  touch-action: manipulation;
}

.reset-btn:hover {
  background: var(--danger-bg);
  border-color: var(--danger);
  color: var(--danger);
}

.checklist-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

.stat-card {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  text-align: center;
}

.stat-card .stat-value {
  font-size: 18px;
  font-weight: 700;
}

.stat-card .stat-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.stat-card .stat-value.done { color: var(--success); }
.stat-card .stat-value.pending { color: var(--warning); }

.steps {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--text);
}

.steps li { margin-bottom: 10px; }

.steps li strong { font-weight: 600; }

.step-text {
  margin-top: 4px;
  color: var(--muted);
  line-height: 1.6;
}

.step-text p {
  margin: 0 0 10px;
}

.step-text p:last-child {
  margin-bottom: 0;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.modal-overlay.visible {
  display: flex;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 400px;
  width: 100%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-content h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.modal-content p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.modal-actions button {
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  touch-action: manipulation;
}

.modal-actions button.primary {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.modal-actions button.primary:hover {
  opacity: 0.85;
}

.modal-actions button:hover {
  border-color: var(--text);
}

.toast-container {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  max-width: 90%;
}

.toast {
  padding: 10px 20px;
  border-radius: 12px;
  background: var(--text);
  color: var(--bg);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastSlide 0.3s ease;
  pointer-events: auto;
  max-width: 100%;
  text-align: center;
}

.toast.success { background: var(--success); color: white; }
.toast.error { background: var(--danger); color: white; }
.toast.warning { background: var(--warning); color: white; }
.toast.info { background: var(--info); color: white; }

@keyframes toastSlide {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.quick-checklist-access {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0 8px;
}

.quick-checklist-btn {
  padding: 10px 8px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  font-size: 12px;
  font-weight: 500;
  touch-action: manipulation;
}

.quick-checklist-btn:hover {
  border-color: var(--text);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.quick-checklist-btn .icon {
  display: block;
  font-size: 20px;
  margin-bottom: 4px;
}

.quick-checklist-btn .progress-mini {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

.keyboard-hint {
  font-size: 10px;
  color: var(--muted);
  text-align: center;
  margin-top: 12px;
  letter-spacing: 0.04em;
}

.keyboard-hint kbd {
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  font-family: inherit;
  font-size: 10px;
}

/* Калькулятор заявки */
.calc-wrap {
  margin-top: 10px;
  display: grid;
  gap: 10px;
}

.calc-section {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--info);
  margin-top: 12px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.calc-section:first-child {
  margin-top: 0;
}

.calc-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.calc-row label {
  font-size: 13px;
  font-weight: 500;
  min-width: 140px;
}

.calc-input {
  width: 80px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-size: 16px;
  background: var(--bg);
  color: var(--text);
}

.calc-row .calc-note {
  font-size: 12px;
  color: var(--muted);
}

.calc-actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.calc-copy-btn {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  background: var(--info);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}

.calc-hint {
  font-size: 11px;
  color: var(--muted);
  align-self: center;
}

.calc-footnote {
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
}

/* Баннер установки PWA */
.install-banner {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 9990;
  background: var(--text);
  color: var(--bg);
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: var(--shadow-lg);
  display: none;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
  max-width: 90%;
}

.install-banner.visible {
  display: flex;
}

.install-banner button {
  border: none;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  white-space: nowrap;
}

.install-banner .install-primary {
  background: var(--info);
  color: #fff;
}

.install-banner .install-close {
  background: none;
  color: var(--muted);
  padding: 4px 6px;
}

.hidden { display: none !important; }

/* === Выбор аккаунта при входе === */
.account-picker-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
  text-align: left;
}

.account-picker-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.account-chip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: all var(--transition);
  touch-action: manipulation;
}

.account-chip:hover {
  border-color: var(--accent);
}

.account-chip.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.account-chip-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
}

.account-chip-role {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

@media (max-width: 420px) {
  .account-picker-grid { grid-template-columns: 1fr; }
}

/* === Текущий пользователь в шапке === */
.header-user {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  min-width: 0;
}

.header-user-name {
  display: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  max-width: 130px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-user-role {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

@media (max-width: 640px) {
  .header-user-name { max-width: 90px; }
}

/* === Раздел «Контроль» === */
.control-syncline {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--muted);
}

.control-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg);
  margin-bottom: 14px;
}

.control-table-head,
.control-row,
.control-total {
  display: grid;
  grid-template-columns: 1fr auto minmax(80px, 130px);
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}

.control-table-head {
  background: var(--bg-soft);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}

.control-user {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.control-name {
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.control-role {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.control-row.is-admin .control-name {
  color: var(--info);
}

.control-count {
  font-size: 13px;
  white-space: nowrap;
}

.control-count.good { color: var(--success); }
.control-count.mid { color: var(--warning); }

.control-pct .progress-bar {
  width: 100%;
}

.control-pct .progress-bar-fill.good { background: var(--success); }
.control-pct .progress-bar-fill.mid { background: var(--warning); }

.control-total {
  border-bottom: none;
  background: var(--bg-soft);
  font-weight: 700;
  font-size: 14px;
}

.control-account {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  margin-bottom: 12px;
  padding: 12px 14px;
}

.control-account-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.control-account-head .control-name {
  font-size: 15px;
}

.control-account-head .control-name.admin {
  color: var(--info);
}

.control-bars {
  display: grid;
  gap: 10px;
}

.control-bar-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}

.control-bar .control-count {
  font-size: 12px;
}

.control-bar .progress-bar {
  width: 100%;
  height: 6px;
}

.control-bar .progress-bar-fill.good { background: var(--success); }
.control-bar .progress-bar-fill.mid { background: var(--warning); }

.control-total-wrap {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-soft);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 14px;
}

.control-total-wrap .muted {
  color: var(--muted);
  font-weight: 400;
}

.screen-sub.small {
  font-size: 12px;
}

.tile-admin {
  border-color: var(--info);
  background: var(--info-bg);

'use strict';
var KOJOStore = (function () {
  var memory = {};
  var available = false;
  try {
    var probe = '__kojo_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    available = true;
  } catch (e) {
    available = false;
  }
  return {
    isAvailable: function () {
      return available;
    },
    get: function (key) {
      try {
        if (available) {
          var v = window.localStorage.getItem(key);
          if (v !== null) return v;
        }
      } catch (e) {}
      return Object.prototype.hasOwnProperty.call(memory, key) ? memory[key] : null;
    },
    set: function (key, value) {
      memory[key] = String(value);
      try {
        if (available) window.localStorage.setItem(key, String(value));
      } catch (e) {}
    },
    remove: function (key) {
      delete memory[key];
      try {
        if (available) window.localStorage.removeItem(key);
      } catch (e) {}
    }
  };
})();

function kojoToday() {
  var d = new Date();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
}

var KOJOState = (function () {
  var THEME_KEY = 'kojo-theme';
  var AUTH_KEY = 'kojo-auth';
  var USER_KEY = 'kojo-current-user';
  var SYNC_PREFIX = 'kojo-cloud';
  var NOTES_PREFIX = 'kojo_notes_';
  var PHOTO_PREFIX = 'kojo_photo_';

  function keyOf(account, clId, date) {
    var d = date || kojoToday();
    return 'checklist_' + d + '_' + account + '_' + clId;
  }

  function syncKey() {
    return SYNC_PREFIX;
  }

  function cleanOldDates(keep) {
    try {
      var remove = [];
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);
        if (k && k.indexOf('checklist_') === 0) {
          var datePart = k.split('_')[1];
          if (datePart && datePart !== keep) remove.push(k);
        }
      }
      for (var j = 0; j < remove.length; j++) window.localStorage.removeItem(remove[j]);
    } catch (e) {}
  }

  return {
    getTheme: function () {
      return KOJOStore.get(THEME_KEY);
    },
    setTheme: function (theme) {
      KOJOStore.set(THEME_KEY, theme);
    },
    setAuth: function (value) {
      KOJOStore.set(AUTH_KEY, value ? '1' : '0');
    },
    isAuth: function () {
      return KOJOStore.get(AUTH_KEY) === '1';
    },
    getCurrentUser: function () {
      return KOJOStore.get(USER_KEY);
    },
    setCurrentUser: function (login) {
      KOJOStore.set(USER_KEY, login);
    },
    getChecklist: function (clId, account, date) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      var raw = KOJOStore.get(keyOf(acc, clId, date));
      if (!raw) return null;
      try {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      } catch (e) {}
      return null;
    },
    saveChecklist: function (clId, arr, account, date) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      KOJOStore.set(keyOf(acc, clId, date), JSON.stringify(arr));
    },
    clearChecklist: function (clId, account, date) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      KOJOStore.remove(keyOf(acc, clId, date));
    },
    getCloudDoc: function () {
      var raw = KOJOStore.get(syncKey());
      if (!raw) return null;
      try {
        var obj = JSON.parse(raw);
        if (obj && obj.date && obj.users) return obj;
      } catch (e) {}
      return null;
    },
    saveCloudDoc: function (doc) {
      KOJOStore.set(syncKey(), JSON.stringify(doc));
    },
    cleanOldDates: function (keep) {
      cleanOldDates(keep);
    },
    getNotes: function (account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      return KOJOStore.get(NOTES_PREFIX + acc) || '';
    },
    setNotes: function (text, account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      KOJOStore.set(NOTES_PREFIX + acc, text);
    },
    getPhoto: function (account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      return KOJOStore.get(PHOTO_PREFIX + acc) || '';
    },
    setPhoto: function (dataUrl, account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      KOJOStore.set(PHOTO_PREFIX + acc, dataUrl);
    },
    exportData: function (clIds, account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      var out = { account: acc, date: kojoToday(), checklists: {} };
      for (var i = 0; i < clIds.length; i++) {
        var id = clIds[i];
        out.checklists[id] = KOJOState.getChecklist(id, acc) || [];
      }
      return out;
    },
    importData: function (payload, clIds, account) {
      var acc = account || KOJOState.getCurrentUser() || 'kojo';
      var applied = [];
      for (var i = 0; i < clIds.length; i++) {
        var id = clIds[i];
        if (payload && payload.checklists && Array.isArray(payload.checklists[id])) {
          KOJOState.saveChecklist(id, payload.checklists[id], acc);
          applied.push(id);
        }
      }
      return applied;
    }
  };
})();

  <script>
'use strict';

// === НАСТРОЙКИ ОБЛАЧНОЙ СИНХРОНИЗАЦИИ (jsonblob.com) ===
// Бесплатное хранилище без ключей и регистрации: зашитый ID «облака» уже
// создан, каждое устройство автоматически работает с ним. Записи становятся
// видны сразу после PUT — никаких задержек консистентности.
var KOJO_SYNC_DEFAULTS = {
  enabled: true,
  binId: '019fe258-7de6-7a69-9f0d-ad75ff01de5c',
  masterKey: ''
};

var KOJOCloud = (function () {
  var BASE = 'https://jsonblob.com/api/jsonBlob/';
  var SETTINGS_KEY = 'kojo-sync-settings';
  var LOG_KEY = 'kojo-sync-log';
  var lastSync = { ok: null, error: '', at: '' };

  function markSync(ok, error) {
    lastSync.ok = ok;
    lastSync.error = error || '';
    lastSync.at = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function getLastSync() {
    return lastSync;
  }

  function addLog(ok, msg) {
    try {
      var log = [];
      var raw = KOJOStore.get(LOG_KEY);
      if (raw) { try { log = JSON.parse(raw) || []; } catch (e) { log = []; } }
      log.push({
        t: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        ok: !!ok,
        msg: String(msg || '')
      });
      if (log.length > 20) log = log.slice(log.length - 20);
      KOJOStore.set(LOG_KEY, JSON.stringify(log));
    } catch (e) {}
  }

  function getLog() {
    try {
      var raw = KOJOStore.get(LOG_KEY);
      return raw ? (JSON.parse(raw) || []) : [];
    } catch (e) { return []; }
  }

  function clearLog() {
    try { KOJOStore.remove(LOG_KEY); } catch (e) {}
  }

  function getSettings() {
    var s = { binId: '', masterKey: '' };
    try {
      var raw = KOJOStore.get(SETTINGS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.binId) {
          s.binId = parsed.binId;
          s.masterKey = parsed.masterKey || '';
        }
      }
    } catch (e) {}
    // Если пользователь ничего не менял — берём встроенный общий блоб
    if (!s.binId && KOJO_SYNC_DEFAULTS.binId) s.binId = KOJO_SYNC_DEFAULTS.binId;
    if (!s.masterKey && KOJO_SYNC_DEFAULTS.masterKey) s.masterKey = KOJO_SYNC_DEFAULTS.masterKey;
    return s;
  }

  function saveSettings(binId, masterKey) {
    try { KOJOStore.set(SETTINGS_KEY, JSON.stringify({ binId: binId, masterKey: masterKey || '' })); } catch (e) {}
  }

  function isConfigured() {
    return !!(getSettings().binId);
  }

  function get(cb) {
    var s = getSettings();
    if (!s.binId) { cb && cb(null, 'не настроено'); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', BASE + s.binId, true);
    xhr.timeout = 15000;
    xhr.onload = function () {
      try {
        if (xhr.status >= 200 && xhr.status < 300) {
          var body = JSON.parse(xhr.responseText);
          var record = body && body.record !== undefined ? body.record : body;
          markSync(true, '');
          addLog(true, 'чтение');
          cb && cb(record, null);
        } else {
          markSync(false, 'HTTP ' + xhr.status);
          addLog(false, 'чтение HTTP ' + xhr.status);
          cb && cb(null, 'HTTP ' + xhr.status);
        }
      } catch (e) {
        markSync(false, 'ошибка ответа');
        addLog(false, 'чтение: ошибка ответа');
        cb && cb(null, 'ошибка ответа');
      }
    };
    xhr.onerror = function () { markSync(false, 'сеть недоступна'); addLog(false, 'чтение: сеть недоступна'); cb && cb(null, 'сеть недоступна'); };
    xhr.ontimeout = function () { markSync(false, 'таймаут'); addLog(false, 'чтение: таймаут'); cb && cb(null, 'таймаут'); };
    xhr.send();
  }

  function set(payload, cb) {
    var s = getSettings();
    if (!s.binId) { cb && cb(null, 'не настроено'); return; }
    var finish = function (status, text) {
      if (status >= 200 && status < 300) {
        markSync(true, '');
        addLog(true, 'запись');
        try {
          cb && cb(JSON.parse(text), null);
        } catch (e) { cb && cb({}, null); }
      } else if (status === 404) {
        // Блоб удалён или ещё не создан — создаём новый и пишем в него
        markSync(false, 'облако удалено (404)');
        addLog(false, 'запись: блоб 404 — создаю заново');
        createBin(payload, function (id) {
          if (id) {
            markSync(true, '');
            addLog(true, 'создан новый блоб + запись');
            cb && cb({}, null);
          } else {
            markSync(false, 'не удалось создать блоб');
            addLog(false, 'создание блоба не удалось');
            cb && cb(null, 'не удалось создать блоб');
          }
        });
      } else {
        markSync(false, 'HTTP ' + status);
        addLog(false, 'запись HTTP ' + status);
        cb && cb(null, 'HTTP ' + status);
      }
    };
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', BASE + s.binId, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 15000;
    xhr.onload = function () {
      try { finish(xhr.status, xhr.responseText); } catch (e) { cb && cb(null, 'ошибка ответа'); }
    };
    xhr.onerror = function () { markSync(false, 'сеть недоступна'); addLog(false, 'запись: сеть недоступна'); cb && cb(null, 'сеть недоступна'); };
    xhr.ontimeout = function () { markSync(false, 'таймаут'); addLog(false, 'запись: таймаут'); cb && cb(null, 'таймаут'); };
    xhr.send(JSON.stringify(payload));
  }

  function createBin(initial, cb) {
    var s = getSettings();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://jsonblob.com/api/jsonBlob', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 20000;
    xhr.onload = function () {
      try {
        if (xhr.status >= 200 && xhr.status < 300) {
          var loc = xhr.getResponseHeader('Location') || '';
          var parts = loc.split('/');
          var id = parts[parts.length - 1];
          if (id) {
            saveSettings(id, s.masterKey || '');
            addLog(true, 'создан новый блоб: ' + id.slice(0, 8) + '…');
            cb && cb(id);
          } else { addLog(false, 'создание: ID не в ответе'); cb && cb(null); }
        } else { addLog(false, 'создание HTTP ' + xhr.status); cb && cb(null); }
      } catch (e) { addLog(false, 'создание: ошибка'); cb && cb(null); }
    };
    xhr.onerror = function () { addLog(false, 'создание: сеть недоступна'); cb && cb(null); };
    xhr.ontimeout = function () { addLog(false, 'создание: таймаут'); cb && cb(null); };
    xhr.send(JSON.stringify(initial));
  }

  return {
    getSettings: getSettings,
    saveSettings: saveSettings,
    isConfigured: isConfigured,
    get: get,
    set: set,
    createBin: createBin,
    getLastSync: getLastSync,
    getLog: getLog,
    clearLog: clearLog
  };
})();

function utf8Bytes(str) {
  var out = [];
  for (var i = 0; i < str.length; i++) {
    var c = str.charCodeAt(i);
    if (c < 128) { out.push(c); }
    else if (c < 2048) { out.push(192 | (c >> 6), 128 | (c & 63)); }
    else { out.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }
  return out;
}

function sha256Hex(str) {
  var msg = utf8Bytes(str);
  var bitLen = msg.length * 8;
  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];
  var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];

  msg.push(0x80);
  while (msg.length % 64 !== 56) msg.push(0);
  var hi = Math.floor(bitLen / 4294967296);
  var lo = bitLen >>> 0;
  msg.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255);
  msg.push((lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  var w = [];
  for (var i = 0; i < msg.length; i += 64) {
    var j;
    for (j = 0; j < 16; j++) {
      var o = i + j * 4;
      w[j] = ((msg[o] << 24) | (msg[o + 1] << 16) | (msg[o + 2] << 8) | msg[o + 3]) >>> 0;
    }
    for (j = 16; j < 64; j++) {
      var s0 = rotr(w[j - 15], 7) ^ rotr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      var s1 = rotr(w[j - 2], 17) ^ rotr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (j = 0; j < 64; j++) {
      var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      var ch = (e & f) ^ (~e & g);
      var temp1 = (h + S1 + ch + K[j] + w[j]) >>> 0;
      var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      var maj = (a & b) ^ (a & c) ^ (b & c);
      var temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var hex = '';
  for (var k = 0; k < 8; k++) {
    var v = H[k].toString(16);
    while (v.length < 8) v = '0' + v;
    hex += v;
  }
  return hex;
}

function showLoginScreen() {

function renderAccountPicker() {

  html += '<div class="account-picker-grid">';

function hideLoginScreen() {
  var ls = $('login-screen');
  var app = document.querySelector('.app');
  if (ls) ls.classList.remove('visible');
  if (app) app.classList.remove('locked');
}

function tryLogin(login, pass) {
  var acc = kojoAccountByLogin(login);
  if (acc && sha256Hex(pass) === acc.passHash) {
    var remember = $('login-remember');
    KOJOState.setAuth(!!(!remember || remember.checked));
    KOJOState.setCurrentUser(login);
    hideLoginScreen();
    initApp();
    return true;
  }
  return false;
}

function submitLogin() {
  var loginEl = $('login-user');
  var passEl = $('login-pass');
  var errEl = $('login-error');
  var selEl = $('selected-account');
  var login = (loginEl && loginEl.value.trim()) || (selEl && selEl.value) || '';
  var pass = passEl ? passEl.value : '';
  if (tryLogin(login, pass)) {
    if (errEl) errEl.textContent = '';
    if (passEl) passEl.value = '';
    if (loginEl) loginEl.value = '';
    showToast('🔓 Добро пожаловать, ' + login + '!', 'success');
    return;
  }
  if (errEl) errEl.textContent = 'Неверный аккаунт или пароль';
  if (passEl) { passEl.value = ''; passEl.focus(); }
  var card = $('login-card');
  if (card) {
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
}

function logout() {
  try { stopCloudSyncPolling(); } catch (e) {}
  try { KOJOState.setAuth(false); } catch (e) {}
  try { goHome(); } catch (e) {}
  var pu = $('login-user'); if (pu) pu.value = '';
  showLoginScreen();
}

function checklistIds() {
  var ids = [];
  for (var key in D.topics) {
    if (D.topics[key].type === 'checklist') ids.push(D.topics[key].clId);

  return ids;
}

function topicByClId(clId) {
  for (var key in D.topics) {
    if (D.topics[key].type === 'checklist' && D.topics[key].clId === clId) return D.topics[key];
  }
  return null;
}

// === ТЕМА ===
function getTheme() {
  if (document.body.classList.contains('red')) return 'red';
  if (document.body.classList.contains('dark')) return 'dark';
  return 'light';
}

function setMetaTheme(color) {
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', color);
}

function setTheme(theme) {
  document.body.classList.remove('dark', 'red');
  var btn = document.querySelector('.theme-toggle');
  if (theme === 'dark') {
    document.body.classList.add('dark');
    if (btn) btn.textContent = '☀️';
    setMetaTheme('#18181b');
  } else if (theme === 'red') {
    document.body.classList.add('red');
    if (btn) btn.textContent = '🌑';
    setMetaTheme('#1a0a0a');
  } else {
    if (btn) btn.textContent = '🌙';
    setMetaTheme('#ffffff');
  }
  try { KOJOState.setTheme(theme); } catch (e) {}
}

function toggleTheme() {
  var current = getTheme();
  var next = current === 'light' ? 'dark' : current === 'dark' ? 'red' : 'light';
  setTheme(next);
}

function renderTopic(key, parent) {
  var box = $('topic-screen');

  if (!topic) return;
  if (!parent) parent = topic.back || 'home';
  var backLabel = 'На главный экран';

    if (D.sections[i].id === parent) { backLabel = D.sections[i].backLabel; break; }
  }

  var html = '';
  html += '<div class="back" data-back-topic="' + parent + '">';
  html += '<div class="back-icon">←</div><span>' + backLabel + '</span>';
  html += '</div>';
  html += '<div class="screen-box">';

  if (topic.type === 'checklist') {
    var clId = topic.clId;
    var state = KOJOState.getChecklist(clId);
    html += '<div class="checklist-header">';
    html += '<h1 class="screen-title">' + topic.icon + ' ' + topic.title + '</h1>';
    html += '<div class="checklist-progress">';
    html += '<span><span id="' + clId + '-progress">0</span>/<span id="' + clId + '-total">0</span></span>';
    html += '<div class="progress-bar"><div class="progress-bar-fill" id="' + clId + '-progress-bar"></div></div>';
    html += '<button class="reset-btn" data-action="reset-checklist" data-checklist="' + clId + '">✕ Сбросить</button>';
    html += '</div>';
    html += '</div>';
    html += '<p class="screen-sub">' + topic.sub + '</p>';
    html += '<ul class="checklist">';

    var idx = 0;
    for (var n = 0; n < topic.items.length; n++) {
      var it = topic.items[n];
      if (it.label) {
        html += '<li class="checklist-item checklist-section-label"><span>' + it.label + '</span></li>';
        continue;
      }
      var checked = state && state[idx] === true;
      html += '<li class="checklist-item' + (checked ? ' completed' : '') + '">';
      html += '<label class="checklist-label">';
      html += '<input type="checkbox" class="checklist-checkbox" data-checklist="' + clId + '"' + (checked ? ' checked' : '') + '>';
      html += '<span class="checklist-text">' + it.text + '</span>';
      html += '</label>';
      if (it.hint) html += '<div class="step-text">' + it.hint + '</div>';
      html += '</li>';
      idx++;
    }
    html += '</ul>';
  } else if (topic.type === 'steps') {
    html += '<h1 class="screen-title">' + topic.icon + ' ' + topic.title + '</h1>';
    html += '<p class="screen-sub">' + topic.sub + '</p>';
    html += '<ol class="steps">';
    for (var s = 0; s < topic.steps.length; s++) {
      var st = topic.steps[s];
      html += '<li><strong>' + st.title + '</strong><div class="step-text">' + st.text + '</div></li>';
    }
    html += '</ol>';
  } else if (topic.type === 'article') {
    html += '<h1 class="screen-title">' + topic.icon + ' ' + topic.title + '</h1>';
    html += '<p class="screen-sub">' + topic.sub + '</p>';
    html += '<div class="step-text">' + topic.body + '</div>';
  } else if (topic.type === 'calc') {
    html += '<h1 class="screen-title">' + topic.icon + ' ' + topic.title + '</h1>';
    html += '<p class="screen-sub">' + topic.sub + '</p>';
    html += '<div class="calc-wrap" id="order-calc">';
    for (var r = 0; r < D.calc.length; r++) {
      var row = D.calc[r];
      if (row.section) {
        html += '<div class="calc-section">' + row.section + '</div>';
        continue;
      }
      html += '<div class="calc-row">';
      html += '<label>' + row.label + '</label>';
      html += '<input type="number" class="calc-input" id="stock-' + row.key + '" value="0" min="0" data-calc="' + row.key + '" data-norm="' + row.norm + '" />';
      html += '<span class="calc-note">норма: ' + row.norm + ' ' + row.unit + ' → заказать: <strong id="order-' + row.key + '">' + row.norm + '</strong></span>';
      html += '</div>';
    }

    html += '<div class="calc-actions">';
    html += '<button class="calc-copy-btn" data-action="copy-order">📋 Копировать заявку</button>';
    html += '<span class="calc-hint">Скопирует все позиции с количеством к заказу</span>';
    html += '</div>';
    html += '<p class="calc-footnote">Нормы рассчитаны на 3 дня до следующей поставки. Уточни нормы у управляющей.</p>';
  }

  html += '</div>';

  box.innerHTML = html;
  box.classList.add('active');

  if (topic.type === 'checklist') {
    updateProgress(topic.clId);
  }
}

// === КОНТРОЛЬ (только для администраторов) ===
function userProgressCount(login) {
  var total = 0;
  var done = 0;
  for (var i = 0; i < CL_IDS.length; i++) {
    var clId = CL_IDS[i];
    var topic = topicByClId(clId);
    if (!topic) continue;
    var state = KOJOState.getChecklist(clId, login);
    var idx = 0;
    for (var j = 0; j < topic.items.length; j++) {
      var it = topic.items[j];
      if (it.label) continue;
      total++;
      if (state && state[idx] === true) done++;
      idx++;
    }
  }
  return { done: done, total: total };
}

var CONTROL_LEVELS = [
  { clId: 'open', icon: '☀️', label: 'Открытие' },
  { clId: 'close', icon: '🌙', label: 'Закрытие' },
  { clId: 'general', icon: '🧹', label: 'Генуборка' }
];

function checklistProgressCount(login, clId) {
  var topic = topicByClId(clId);
  if (!topic) return { done: 0, total: 0 };
  var state = KOJOState.getChecklist(clId, login);
  var idx = 0;
  var total = 0;
  var done = 0;
  for (var j = 0; j < topic.items.length; j++) {
    var it = topic.items[j];
    if (it.label) continue;
    total++;
    if (state && state[idx] === true) done++;
    idx++;
  }
  return { done: done, total: total };
}

function runConnectionTest() {
  var out = $('sync-test-result');
  if (!out) return;
  out.textContent = '⏳ Проверяем…';
  var t0 = Date.now();
  KOJOCloud.get(function (doc, err) {
    if (err) { out.textContent = '❌ Ошибка чтения bin: ' + err; return; }
    if (!doc || typeof doc !== 'object') { out.textContent = '❌ Бин пуст или не содержит данных'; return; }
    var probe = '__probe__';
    doc.users = doc.users || {};
    doc.users[probe] = ['ok'];
    KOJOCloud.set(doc, function (res, err2) {
      if (err2) { out.textContent = '❌ Ошибка записи в bin: ' + err2; return; }
      // jsonbin может отдавать чтение с небольшой задержкой — пробуем несколько раз
      var tries = 0;
      var tryRead = function () {
        KOJOCloud.get(function (doc2, err3) {
          if (err3 || !doc2 || !doc2.users || !doc2.users[probe]) {
            tries++;
            if (tries < 5) { setTimeout(tryRead, 400); return; }
            out.textContent = '❌ Запись не прочиталась обратно' + (err3 ? ' (' + err3 + ')' : '');
            return;
          }
          delete doc2.users[probe];
          KOJOCloud.set(doc2, function (res4, err4) {
            out.textContent = '✅ Связь с облаком есть: запись + чтение за ' + (Date.now() - t0) + ' мс';
          });
        });
      };
      tryRead();
    });
  });
}

// === ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ ===
var syncTimer = null;
var cloudSyncing = false;
var cloudTimer = null;
var cloudDirty = true;

function pushCloud(cb, freshDoc) {
  var user = currentUser();
  if (!user || !KOJOCloud.isConfigured()) { if (cb) cb(); return; }
  var today = kojoToday();
  var doc = { date: today, users: {} };
  var finishPush = function (cloud, ok) {
    if (!ok) { updateHeaderSyncBadge(); if (cb) cb(); return; }
    if (cloud && cloud.date === today && cloud.users) doc.users = cloud.users;
    doc.users[user] = {};
    for (var i = 0; i < CL_IDS.length; i++) {
      var clId = CL_IDS[i];
      var arr = KOJOState.getChecklist(clId, user);
      if (arr) doc.users[user][clId] = arr;
    }
    var meta = {};
    var ph = KOJOState.getPhoto(user);
    if (ph) meta.photo = ph;
    var nt = KOJOState.getNotes(user);
    if (nt) meta.notes = nt;
    if (Object.keys(meta).length) doc.users[user].meta = meta;
    KOJOState.saveCloudDoc(doc);
    KOJOCloud.set(doc, function (res, err2) {
      if (!err2) cloudDirty = false;
      updateHeaderSyncBadge();
      if (res) { if (console) console.log('KOJO sync ok'); }
      if (cb) cb();
    });
  };
  // Свежий документ уже есть (из цикла опроса) — пишем на его основе.
  // ВАЖНО: перед записью всегда нужна актуальная копия bin, иначе можно
  // стереть данные других устройств. Если свежей копии нет — читаем заново;
  // при ошибке чтения НИЧЕГО не пишем.
  if (freshDoc && typeof freshDoc === 'object' && freshDoc.date === today && freshDoc.users) {
    finishPush(freshDoc, true);
  } else {
    KOJOCloud.get(function (cloud, err) {
      finishPush(cloud, !err);
    });
  }
}

function scheduleCloudPush() {
  cloudDirty = true;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloud, 800);
}

function syncAllFromCloud(cb) {
  if (cloudSyncing) {
    if (cb) cb();
    return;
  }
  cloudSyncing = true;
  var finished = function () {
    cloudSyncing = false;
    refreshAllViews();
    updateHeaderSyncBadge();
    if (cb) cb();
  };
  KOJOCloud.get(function (doc, err) {
    try {
      // ОШИБКА (сеть/сервер/таймаут): НЕ пишем в bin ничего — чужие данные
      // остаются целыми. Просто ждём следующего цикла опроса.
      if (err) { finished(); return; }
      var today = kojoToday();
      if (!doc || !doc.users) {
        // Облако пустое или ещё не создано — безопасно начать с чистого документа.
        doc = { date: today, users: {} };
        KOJOState.saveCloudDoc(doc);
        KOJOCloud.set(doc, function (res, err2) { finished(); });
      } else if (doc.date !== today) {
        if (doc.date < today) {
          // Наступил новый день — начинаем с чистого документа.
          doc = { date: today, users: {} };
          KOJOState.saveCloudDoc(doc);
          KOJOCloud.set(doc, function (res, err2) { finished(); });
        } else {
          // Дата в облаке позже (устройство с другим часовым поясом/календарём) —
          // данные не трогаем и не пишем, чтобы ничего не потерять.
          finished();
        }
      } else {
        // переносим облачные данные в локальное хранилище для каждого аккаунта
        for (var user in doc.users) {
          var u = doc.users[user];
          if (!u) continue;
          for (var clId in u) {
            if (Array.isArray(u[clId])) KOJOState.saveChecklist(clId, u[clId], user);
          }
          if (u.meta) {
            if (u.meta.photo) KOJOState.setPhoto(u.meta.photo, user);
            if (u.meta.notes) KOJOState.setNotes(u.meta.notes, user);
          }
        }
        KOJOState.saveCloudDoc(doc);
        try { KOJOState.cleanOldDates(today); } catch (e) {}
        // Записываем обратно ТОЛЬКО если что-то изменилось локально
        // (иначе лишний запрос и риск обнуления чужих данных).
        if (cloudDirty) { pushCloud(finished, doc); } else { finished(); }
      }
    } catch (e) { finished(); }
  });
}

function startCloudSyncPolling() {
  stopCloudSyncPolling();
  if (!KOJOCloud.isConfigured()) return;
  cloudTimer = setInterval(function () {
    try {
      if (!isAuthenticated() || !currentUser()) return;
      syncAllFromCloud(function () {
        var box = $('section-screen');
        if (box && box.classList.contains('active')) {
          var titleEl = box.querySelector('.screen-title');

}

// === ЧЕК-ЛИСТЫ ===
function getChecklistStats(clId) {
  var topic = topicByClId(clId);
  if (!topic) return { done: 0, total: 0 };
  var total = 0;
  var done = 0;
  var state = KOJOState.getChecklist(clId);
  var idx = 0;
  for (var i = 0; i < topic.items.length; i++) {
    var it = topic.items[i];
    if (it.label) continue;
    total++;
    if (state && state[idx] === true) done++;
    idx++;
  }
  return { done: done, total: total };
}

function updateProgress(clId) {
  var box = $('topic-screen');
  if (!box) return;
  var items = box.querySelectorAll('.checklist-checkbox[data-checklist="' + clId + '"]');
  var checked = box.querySelectorAll('.checklist-checkbox[data-checklist="' + clId + '"]:checked');
  var total = items.length;
  var done = checked.length;

  var progressSpan = $(clId + '-progress');
  var totalSpan = $(clId + '-total');
  var progressBar = $(clId + '-progress-bar');

  if (progressSpan) progressSpan.textContent = done;
  if (totalSpan) totalSpan.textContent = total;
  if (progressBar) {
    progressBar.style.width = total > 0 ? ((done / total) * 100) + '%' : '0%';
  }

  for (var i = 0; i < items.length; i++) {
    var li = items[i].closest('.checklist-item');
    if (li) li.classList.toggle('completed', items[i].checked);
  }

  saveChecklistState(clId);
  updateMiniProgress(clId);
  updateChecklistsBadge();
  updateStats();
  scheduleCloudPush();

  if (done === total && total > 0) {
    showToast('✅ Чек-лист выполнен!', 'success');
  }
}

function saveChecklistState(clId) {
  var box = $('topic-screen');
  if (!box) return;
  var items = box.querySelectorAll('.checklist-checkbox[data-checklist="' + clId + '"]');
  var state = [];
  for (var i = 0; i < items.length; i++) {
    state.push(items[i].checked);
  }
  KOJOState.saveChecklist(clId, state);
}

function resetChecklist(clId) {
  if (!window.confirm('Сбросить все пункты чек-листа?')) return;
  KOJOState.clearChecklist(clId);
  var box = $('topic-screen');
  if (box) {
    var items = box.querySelectorAll('.checklist-checkbox[data-checklist="' + clId + '"]');

function handlePhotoFile(file) {
  var user = currentUser();
  if (!file || !user) return;
  if (file.size > 4 * 1024 * 1024) {
    showToast('⚠️ Фото слишком большое (до 4 МБ)', 'warning');
    return;
  }
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var MAX = 256;
      var w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        var k = Math.min(MAX / w, MAX / h);
        w = Math.round(w * k);
        h = Math.round(h * k);
      }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl;
      try { dataUrl = canvas.toDataURL('image/jpeg', 0.82); } catch (e) { dataUrl = reader.result; }
      if (dataUrl.length > 220000) {
        try { dataUrl = canvas.toDataURL('image/jpeg', 0.6); } catch (e) {}
      }
      KOJOState.setPhoto(dataUrl, user);
      refreshAvatar();
      showToast('📷 Фото профиля обновлено', 'success');
    };
    img.onerror = function () {
      showToast('⚠️ Не удалось прочитать изображение', 'warning');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

          if (tKey) renderTopic(tKey, 'checklists');

      }

}

// === ПОИСК ===
var searchableItems = null;

function buildSearchIndex() {
  var arr = [];
  for (var i = 0; i < D.sections.length; i++) {
    var sec = D.sections[i];
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      arr.push({ id: it.id, icon: it.icon, text: it.title, section: SECTION_LABELS[sec.id] || sec.screenTitle });
    }
  }
  arr.push({ id: 'order-request', icon: '📋', text: 'Написание заявки (расчёт остатков)', section: 'Чек-листы' });
  return arr;
}

function simpleSearch(items, query) {
  var q = query.toLowerCase().trim();
  if (!q) return items;
  var res = [];
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.text.toLowerCase().indexOf(q) !== -1 || item.section.toLowerCase().indexOf(q) !== -1) {
      res.push(item);
    }
  }
  return res;
}

var selectedSuggestionIndex = -1;

function closeSuggestions() {
  var el = $('search-suggestions');
  if (!el) return;
  el.classList.remove('visible');
  el.innerHTML = '';
  selectedSuggestionIndex = -1;
}

function renderSuggestions(matches) {
  var el = $('search-suggestions');
  if (!el) return;
  if (matches.length === 0) {
    closeSuggestions();
    return;
  }
  var html = '';
  for (var i = 0; i < matches.length; i++) {
    var item = matches[i];
    html += '<div class="suggestion-item" data-index="' + i + '" data-id="' + item.id + '" data-action="navigate-search">';
    html += '<span class="sug-icon">' + item.icon + '</span>';
    html += '<span>' + item.text + '</span>';
    html += '<span class="sug-section">' + item.section + '</span>';
    html += '</div>';
  }
  el.innerHTML = html;
  el.classList.add('visible');
  selectedSuggestionIndex = -1;
}

function navigateToSearchResult(id) {
  if (!searchableItems) searchableItems = buildSearchIndex();
  var item = null;
  for (var i = 0; i < searchableItems.length; i++) {
    if (searchableItems[i].id === id) { item = searchableItems[i]; break; }
  }
  if (!item) return;
  closeSuggestions();

  var sectionMap = { 'Чек-листы': 'checklists', 'Что делать если': 'ifs', 'Важное': 'important', 'История и Философия': 'rules' };
  var sectionKey = sectionMap[item.section] || 'checklists';
  openTopic(id, sectionKey);
}

function clearSearch() {
  var input = $('search');
  var count = $('search-count');
  if (!input || !count) return;
  input.value = '';
  closeSuggestions();
  count.style.display = 'none';
  var links = document.querySelectorAll('.item-link');
  for (var i = 0; i < links.length; i++) {
    links[i].style.display = '';
  }
  input.focus();
}

// === КАЛЬКУЛЯТОР ===
function calcOrder(key, norm) {
  var input = $('stock-' + key);
  if (!input) return;
  var val = parseInt(input.value, 10) || 0;
  var order = Math.max(0, norm - val);
  var out = $('order-' + key);
  if (out) out.textContent = order;
}

function copyOrderToClipboard() {
  var lines = [];
  for (var i = 0; i < D.calc.length; i++) {
    var row = D.calc[i];
    if (row.section) continue;
    var stock = 0;
    var input = $('stock-' + row.key);
    if (input) stock = parseInt(input.value, 10) || 0;
    var order = Math.max(0, row.norm - stock);
    if (order > 0) lines.push(row.short + ': ' + order + ' ' + row.unit);
  }
  if (lines.length === 0) {
    showToast('⚠️ Нет позиций для заказа', 'warning');
    return;
  }
  lines.unshift('📋 Заявка на поставку:');
  var text = lines.join('\n');
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('✅ Заявка скопирована в буфер обмена', 'success');
      }).catch(function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  } catch (e) {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  try {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('✅ Заявка скопирована в буфер обмена', 'success');
  } catch (e) {
    showToast('⚠️ Не удалось скопировать', 'error');
  }
}

// === TOAST ===
function showToast(message, type) {
  var container = $('toast-container');
  if (!container) return;
  type = type || '';
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function () {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px) scale(0.95)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }, 2500);
}

function showStatsModal() {
  var html = '<div style="display:grid;gap:8px;margin:8px 0 16px">';
  var total = 0;
  var done = 0;
  for (var i = 0; i < CL_IDS.length; i++) {
    var clId = CL_IDS[i];
    var s = getChecklistStats(clId);
    total += s.total;
    done += s.done;
    if (s.total > 0) {
      html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">';
      html += '<span>' + (D.checklistStatsLabels[clId] || clId) + '</span>';
      html += '<span><strong>' + s.done + '</strong> / ' + s.total + '</span>';
      html += '</div>';
    }
  }
  html += '<div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:16px;border-top:2px solid var(--border)">';
  html += '<span>Всего</span><span><strong>' + done + '</strong> / ' + total + '</span>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)">';
  html += '<span>Прогресс</span><span>' + (total > 0 ? Math.round((done / total) * 100) : 0) + '%</span>';
  html += '</div>';

  var content = $('stats-content');
  if (content) content.innerHTML = html;

  var modal = $('stats-modal');

}

function closeStatsModal() {
  var el = $('stats-modal');
  if (el) el.classList.remove('visible');
}

function exportProgress() {
  var payload = {
    app: D.appName,
    version: D.version,
    exportedAt: new Date().toISOString(),
    user: currentUser() || '',
    checklists: KOJOState.exportData(CL_IDS).checklists
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'kojo-guide-progress.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1000);
  showToast('⬇️ Прогресс сохранён в файл', 'success');
}

function importProgressFromFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var payload = JSON.parse(reader.result);
      if (!payload || payload.app !== D.appName) {
        showToast('⚠️ Это не файл прогресса KOJO Guide', 'error');
        return;
      }
      var applied = KOJOState.importData(payload, CL_IDS);
      if (applied.length === 0) {
        showToast('⚠️ В файле нет данных чек-листов', 'warning');
        return;
      }
      refreshAllViews();
      scheduleCloudPush();
      showToast('⬆️ Прогресс импортирован (' + applied.length + ' чек-листов)', 'success');
    } catch (e) {
      console.error('KOJO import:', e);
      showToast('⚠️ Не удалось прочитать файл', 'error');
    }
  };
  reader.onerror = function () {
    showToast('⚠️ Не удалось прочитать файл', 'error');
  };
  reader.readAsText(file);
}

// === СЛУШАТЕЛИ ===
function setupSearchListeners() {
  var input = $('search');
  if (!input) return;
  input.addEventListener('input', function () {
    try {
      var q = input.value.toLowerCase().trim();
      var clearBtn = $('clear-search');
      if (clearBtn) clearBtn.classList.toggle('visible', q.length > 0);

      if (!q) {
        closeSuggestions();
        var count = $('search-count');
        if (count) count.style.display = 'none';
        var links = document.querySelectorAll('.item-link');
        for (var i = 0; i < links.length; i++) links[i].style.display = '';
        return;
      }

      if (!searchableItems) searchableItems = buildSearchIndex();
      var matches = simpleSearch(searchableItems, q);
      var count2 = $('search-count');
      if (count2) {
        count2.textContent = 'Найдено: ' + matches.length + ' из ' + searchableItems.length;
        count2.style.display = 'block';
      }
      renderSuggestions(matches);

      var links2 = document.querySelectorAll('.item-link');
      for (var j = 0; j < links2.length; j++) {
        var text = links2[j].innerText.toLowerCase();
        links2[j].style.display = text.indexOf(q) !== -1 ? '' : 'none';
      }
    } catch (e) { console.error('KOJO search input:', e); }
  });

  input.addEventListener('keydown', function (e) {
    try {
      var el = $('search-suggestions');
      if (!el) return;
      var items = el.querySelectorAll('.suggestion-item');
      if (items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
      } else if (e.key === 'Enter' && selectedSuggestionIndex >= 0) {
        e.preventDefault();
        var id = items[selectedSuggestionIndex].getAttribute('data-id');
        navigateToSearchResult(id);
        return;
      } else {
        return;
      }

      for (var i = 0; i < items.length; i++) {
        if (i === selectedSuggestionIndex) items[i].classList.add('highlighted');
        else items[i].classList.remove('highlighted');
      }
      if (selectedSuggestionIndex >= 0 && items[selectedSuggestionIndex]) {
        try { items[selectedSuggestionIndex].scrollIntoView({ block: 'nearest' }); } catch (e2) {}
      }
    } catch (e) { console.error('KOJO search keydown:', e); }
  });
}

      quickEndShift();
      return;

      quickChecklist();
      return;

      return;
    }
    if (action === 'clear-search') {

      return;
    }
    if (action === 'open-checklist') {

      openChecklist(target.getAttribute('data-checklist'));

    if (action === 'scroll-to-sections') {
      e.preventDefault();
      var grid = document.querySelector('.grid');
      if (grid) {
        try { grid.scrollIntoView({ behavior: 'smooth' }); } catch (e3) { grid.scrollIntoView(); }
      }
      return;
    }
    if (action === 'show-section') {
      e.preventDefault();
      showSection(target.getAttribute('data-section'));
      return;
    }
    if (action === 'open-topic' || target.hasAttribute('data-open-topic')) {
      e.preventDefault();
      var topic = target.getAttribute('data-topic') || target.getAttribute('data-open-topic');
      var parent = target.getAttribute('data-parent');
      openTopic(topic, parent);
      return;
    }
    if (target.hasAttribute('data-back')) {

      goHome();
      return;
    }
    if (target.hasAttribute('data-back-topic')) {
      e.preventDefault();
      goBackToSection(target.getAttribute('data-back-topic'));

    }
    if (action === 'reset-checklist') {

      e.preventDefault();

      if (fileInput) fileInput.click();
      return;
    }
    if (action === 'copy-order') {
      e.preventDefault();

    }

      e.preventDefault();
      openTopic(target.getAttribute('data-topic'), target.getAttribute('data-parent'));
      return;
    }
    if (action === 'navigate-search') {
      e.preventDefault();
      var sid = target.getAttribute('data-id');
      if (sid) navigateToSearchResult(sid);
      return;
    }
    if (target.classList.contains('chip') && target.getAttribute('data-suggest')) {
      e.preventDefault();
      onChipClick(target.getAttribute('data-suggest'));
      return;
    }
    if (action === 'install-app') {
      e.preventDefault();
      installPwa();
      return;
    }
    if (action === 'dismiss-install') {
      e.preventDefault();
      hideInstallBanner();
      return;
    }
  } catch (err) {
    console.error('KOJO click handler:', err);
  }
});

var deferredPrompt = null;

function registerServiceWorker() {
  try {
    var proto = window.location.protocol;
    var host = window.location.hostname;
    if ((proto === 'https:' || host === 'localhost' || host === '127.0.0.1') && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('KOJO SW register:', err);
      });
    }
  } catch (e) {}
}

function setupInstallBanner() {
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    try {
      if (KOJOStore.get('kojo-install-dismissed') !== '1') showInstallBanner();
    } catch (e2) {}
  });
}

function initApp() {
  try {
    if (!isAuthenticated() || !currentUser()) {
      showLoginScreen();
      return;
    }
    hideLoginScreen();

    var savedTheme = KOJOState.getTheme();
    if (savedTheme && (savedTheme === 'dark' || savedTheme === 'red')) {
      setTheme(savedTheme);
    } else {
      setTheme('light');
    }

    try { KOJOState.cleanOldDates(kojoToday()); } catch (e) {}
    renderHome();
    updateAllMiniProgress();
    updateChecklistsBadge();
    updateStats();
    refreshAvatar();
    updateHeaderAdminButtons();
    scheduleCloudPush();
    syncAllFromCloud(function () {
      renderHome();
      updateAllMiniProgress();
      updateChecklistsBadge();
      updateStats();
      updateHeaderAdminButtons();
    });
    startCloudSyncPolling();

    setupSearchListeners();
    setupInstallBanner();

    var modal = $('stats-modal');
    if (modal) {
      modal.addEventListener('click', function (e) {
        if (e.target === e.currentTarget) closeStatsModal();
      });
    }
    var smodal = $('sync-modal');
    if (smodal) {
      smodal.addEventListener('click', function (e) {
        if (e.target === e.currentTarget) closeSyncModal();
      });
    }
    var pmodal = $('profile-modal');
    if (pmodal) {
      pmodal.addEventListener('click', function (e) {
        if (e.target === e.currentTarget) closeProfileModal();
      });
    }
    var photoFile = $('photo-file');
    if (photoFile) {
      photoFile.addEventListener('change', function () {
        if (photoFile.files && photoFile.files.length > 0) {
          handlePhotoFile(photoFile.files[0]);
          photoFile.value = '';
        }
      });
    }
    var notesEl2 = $('profile-notes');
    if (notesEl2) {
      notesEl2.addEventListener('input', function () {
        saveProfileNotes();
      });
    }

    var fileInput = $('import-file');
    if (fileInput) {
      fileInput.addEventListener('change', function () {
        if (fileInput.files && fileInput.files.length > 0) {
          importProgressFromFile(fileInput.files[0]);
          fileInput.value = '';
        }
      });
    }

    registerServiceWorker();

    console.log('💡 KOJO Guide: Используйте Ctrl+K для поиска, Escape для выхода');
  } catch (e) {
    console.error('KOJO init:', e);
  }
}

try {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
} catch (e) {
  console.error('KOJO boot:', e);
}

var loginFormEl = $('login-form');
if (loginFormEl) {
  loginFormEl.addEventListener('submit', function (e) {
    e.preventDefault();
    submitLogin();
  });
}
</script>
</body>
</html>
